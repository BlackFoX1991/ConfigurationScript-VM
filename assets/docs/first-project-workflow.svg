<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">First CFGS project: files and successful run</title>
  <desc id="desc">Illustrated project folder containing cfgs.json, main.cfs, and a module, next to terminal output for init, check, and script execution.</desc>
  <rect width="1120" height="440" rx="18" fill="#0b111b"/>
  <rect x="18" y="18" width="330" height="404" rx="12" fill="#142030" stroke="#35506a"/>
  <rect x="364" y="18" width="738" height="404" rx="12" fill="#101a28" stroke="#35506a"/>
  <text x="42" y="55" fill="#82e9cd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PROJECT FILES</text>
  <text x="390" y="55" fill="#82e9cd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">POWERSHELL · EXAMPLE OUTPUT</text>
  <line x1="18" y1="73" x2="348" y2="73" stroke="#35506a"/>
  <line x1="364" y1="73" x2="1102" y2="73" stroke="#35506a"/>
  <g font-family="Consolas, Cascadia Code, monospace" font-size="19" fill="#e8eef5">
    <text x="42" y="112" font-weight="700">▾ hello-cfgs</text>
    <text x="69" y="158">▤ cfgs.json</text>
    <text x="69" y="201">▤ main.cfs</text>
    <text x="69" y="244">▾ Modules</text>
    <text x="97" y="287">▤ Greeter.cfs</text>
  </g>
  <rect x="386" y="95" width="692" height="304" rx="8" fill="#0a1420"/>
  <g font-family="Consolas, Cascadia Code, monospace" font-size="18">
    <text x="408" y="130" fill="#c6d5e4">PS&gt; dotnet $cfgsVm init --project $projectDir</text>
    <text x="408" y="165" fill="#82e9cd">[CFGS] initialized cfgs.json</text>
    <text x="408" y="200" fill="#c6d5e4">PS&gt; dotnet $cfgsVm -check .\main.cfs</text>
    <text x="408" y="235" fill="#82e9cd">[CHECK] ok: main.cfs</text>
    <text x="408" y="270" fill="#c6d5e4">PS&gt; dotnet $cfgsVm .\main.cfs</text>
    <text x="408" y="305" fill="#f5cc82">Hello, CFGS!</text>
    <text x="408" y="361" fill="#89a4b9" font-size="14">Paths shortened for clarity · Output verified with the CLI</text>
  </g>
</svg>
